<!--
    Authors:      Krish Choudhary, Prithvi Pathania, Ricky Mormor
    Date:         2026-05-29
    Course:       CPRG 306 B - Advanced JavaScript and Tailwind CSS
    Page:         Weight conversion (pounds <-> kilograms)
    Inputs:       Conversion direction (dropdown), one or more numbers.
    Processing:   js/Script.js uses a higher-order function to look up the
                  correct formula and convert a single value or list.
    Outputs:      The converted value(s) shown in the result panel.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Conversion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 font-sans min-h-screen" data-page="weight">

    <!-- NavBar -->
    <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm m-4">
        <nav class="flex flex-col sm:flex-row sm:items-center sm:justify-between px-6 py-4 border-b border-gray-100 gap-3">
            <a href="index.html" class="text-lg font-bold text-gray-900">Conversions</a>
            <div class="flex flex-wrap items-center gap-6">
                <a href="weight.html" class="text-sm font-semibold text-blue-600">Weight</a>
                <a href="distance.html" class="text-sm text-gray-600 hover:text-blue-600">Distance</a>
                <a href="temperature.html" class="text-sm text-gray-600 hover:text-blue-600">Temperature</a>
            </div>
        </nav>
    </div>

    <!-- Weight conversion form -->
    <main class="px-4 md:px-6 max-w-2xl mx-auto">
        <div class="bg-gradient-to-br from-orange-200 to-green-700 rounded-2xl text-blue-900 p-6 md:p-10 mb-6 shadow">
            <h1 class="text-2xl md:text-3xl font-bold text-center mb-6">Weight Conversion</h1>

            <form class="space-y-4">
                <!-- Conversion direction dropdown -->
                <div>
                    <label for="direction" class="block text-sm font-semibold mb-1">Convert</label>
                    <select id="direction" class="w-full rounded-xl px-3 py-2 bg-white text-gray-800">
                        <option value="lb-kg">Pounds (lb) to Kilograms (kg)</option>
                        <option value="kg-lb">Kilograms (kg) to Pounds (lb)</option>
                    </select>
                </div>

                <!-- Single value OR list of values -->
                <div>
                    <label for="values" class="block text-sm font-semibold mb-1">
                        Value(s) <span class="font-normal text-blue-950/70">(one number, or several separated by commas/spaces)</span>
                    </label>
                    <input id="values" type="text" placeholder="e.g. 150  or  150, 200, 250"
                           class="w-full rounded-xl px-3 py-2 bg-white text-gray-800">
                </div>

                <!-- Submit -->
                <button id="convert" type="submit"
                        class="w-full sm:w-auto bg-white text-blue-700 font-semibold rounded-xl hover:bg-blue-100 text-sm md:text-base px-6 py-2">
                    Convert
                </button>
            </form>

            <!-- Result panel -->
            <div id="result" class="mt-6 bg-white/80 text-blue-900 rounded-xl p-4 text-center font-semibold min-h-[3rem]">
                Result will appear here.
            </div>
        </div>
    </main>

    <script src="js/Script.js"></script>
</body>
</html>
